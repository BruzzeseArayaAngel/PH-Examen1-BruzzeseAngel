<div class="page-container">
  <form>
    <ion-card>
      <ion-card-header>
        <ion-card-title>Circulo</ion-card-title>
        <ion-card-subtitle>Perímetro</ion-card-subtitle>
      </ion-card-header>
    
      <ion-card-content>
        El perímetro de un círculo es la longitud de la línea que forma su borde.
      </ion-card-content>
    </ion-card>
    <div class="contenedor">
      <ion-img
      src="https://nemdigitalstorage.blob.core.windows.net/nem-main/images/2023/05/12/be30ba6c-04ee-47d2-85ab-048ba67338d8.png"
      alt="Perimetro circulo"
    ></ion-img>    </div>
    <ion-list lines="none">
      <ion-item>
        <ion-input [(ngModel)]="txtRadio" name="txtRadio" type="number" label="Radio (cm)" label-placement="floating" fill="solid"
        placeholder="Ingrese un valor"></ion-input>
      </ion-item>
      <ion-item>
        <ion-button (click)="calcularPerimetro()">Calcular el perímetro</ion-button>
      </ion-item>
      <ion-item>
        {{resultado}}
      </ion-item>
    </ion-list>
  </form>
</div>
